[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aither-world-model"
version = "0.1.0"
description = "A small, dependency-light world-model package: LeWM JEPA + MLP engines, environment adapters"
requires-python = ">=3.10"
# torch/numpy are OPTIONAL at import time (engines degrade loudly without them);
# they are listed here because every real deployment wants them.
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0", "numpy>=1.24"]
dev = ["torch>=2.0", "numpy>=1.24", "pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["world_model*"]
