[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awm"
version = "0.1.0"
description = "A portable, scoped agent memory — hierarchical tenant:user:project scopes where a write lands at exactly one scope, a read includes ancestors by distance, and siblings never leak."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# stdlib only (sqlite3, json). An agent's memory is the last thing that should
# need a network or a service to be usable off-fleet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
awm = "awm.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awm"
Repository = "https://github.com/Aitherium/awm.git"

[tool.setuptools]
packages = ["awm"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
