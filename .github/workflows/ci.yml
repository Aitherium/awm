name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with torch and pytest
        # torch is installed explicitly, not left optional: pytest.importorskip
        # in tests/ means a missing torch SKIPS every real test instead of
        # failing, and a CI run that reports green while skipping everything
        # is worse than one that fails -- it looks like coverage and is none.
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Confirm tests actually ran (not skipped for lack of torch)
        run: |
          python -m pytest tests/ -v --collect-only -q | tail -1
          python -c "import torch; print('torch', torch.__version__, 'present')"
